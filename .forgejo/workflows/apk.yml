# Build, sign and publish the field APK on every push to main (self-hosted Forgejo runner).
# Publishes only when versionCode in app/build.gradle.kts is above the live one -- bump it to ship.
# The runner image, the apk-publish tool and the secrets are documented in dvladi/android-ci.
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: android
    container:
      image: android-ci:1
      volumes:
        - android-dist:/dist
        - android-gradle:/gradle
    env:
      GRADLE_USER_HOME: /gradle
    steps:
      - uses: actions/checkout@v4

      # The field app is the release variant; app/build.gradle.kts reads ../release-keystore.jks
      # (gitignored) and holds its passwords.
      - name: Signing key
        run: install-keystore RELEASE_KEYSTORE_B64 release-keystore.jks
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

      # A build without the updater token loses off-LAN updates, and one without the book-server
      # credentials can't open the self-hosted catalogs, so any missing secret = fail.
      - name: Build
        run: |
          : "${ORG_GRADLE_PROJECT_CF_ACCESS_CLIENT_ID:?CF_ACCESS_CLIENT_ID secret missing}"
          : "${ORG_GRADLE_PROJECT_CF_ACCESS_CLIENT_SECRET:?CF_ACCESS_CLIENT_SECRET secret missing}"
          : "${ORG_GRADLE_PROJECT_BOOKS_OPDS_USER:?BOOKS_OPDS_USER secret missing}"
          : "${ORG_GRADLE_PROJECT_BOOKS_OPDS_PASS:?BOOKS_OPDS_PASS secret missing}"
          sh ./gradlew :app:assembleRelease --console=plain
        env:
          ORG_GRADLE_PROJECT_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ORG_GRADLE_PROJECT_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ORG_GRADLE_PROJECT_BOOKS_OPDS_USER: ${{ secrets.BOOKS_OPDS_USER }}
          ORG_GRADLE_PROJECT_BOOKS_OPDS_PASS: ${{ secrets.BOOKS_OPDS_PASS }}

      - name: Publish
        run: apk-publish --app opds --package com.example.opdslibrary --build-type release --apk 'app/build/outputs/apk/release/*.apk'
